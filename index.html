<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>BrowseAnony</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab-btn" title="New tab (Ctrl+T)">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <div id="toolbar">
    <button id="back-btn" title="Back">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="fwd-btn" title="Forward">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="reload-btn" title="Reload">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>
    </button>
    <input id="address" type="text" placeholder="Search or enter address" />
    <button id="go-btn" title="Go">Go</button>
    <span id="privacy-badge" title="All browsing is in-memory only and wiped on quit. Trackers/ads are blocked.">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      Anony
    </span>
  </div>

  <div id="view-container"></div>

  <script src="renderer.js"></script>
</body>
</html>
